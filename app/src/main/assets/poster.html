<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gerador de Posts</title>
<script src="android_bridge.js"></script>
<style>
  :root {
    --bg: #212121;
    --panel: #333;
    --input: #424242;
    --text: #eee;
    --accent: #ff9800;
    --accent-hover: #f57c00;
    --line: #555;
    --preview: #17212b;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .app {
    width: min(1200px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }

  h2 {
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin: 0;
    font-size: 18px;
  }

  .group {
    background: var(--panel);
    padding: 15px;
    border-radius: 10px;
    border-left: 3px solid var(--accent);
  }

  .label-tit {
    font-size: 12px;
    color: #aaa;
    font-weight: bold;
    margin-bottom: 6px;
    display: block;
    text-transform: uppercase;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }

  .row.row-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  input, select, textarea {
    width: 100%;
    min-width: 0;
    padding: 11px 10px;
    background: var(--input);
    border: 1px solid var(--line);
    color: white;
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  .help-text {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
  }

  .preview-container {
    background: var(--preview);
    padding: 15px;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid #000;
    overflow-wrap: anywhere;
  }

  .preview-container b { font-weight: 700; color: #fff; }
  .preview-container a { color: #64b5f6; text-decoration: none; font-weight: bold; }
  .preview-container pre {
    background: rgba(0,0,0,0.3);
    padding: 8px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    color: #81c784;
    display: block;
    margin: 5px 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .preview-container i { font-style: italic; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 0;
  }

  button {
    width: 100%;
    min-height: 46px;
    padding: 12px 14px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-visual { background: var(--accent); color: #212121; }
  .btn-visual:hover { background: var(--accent-hover); }
  .btn-html { background: #444; color: #ccc; font-size: 13px; }
  .btn-html:hover { background: #555; }
  .btn-danger { background: #e74c3c; color: white; }

  .hidden-area {
    opacity: 0;
    position: absolute;
    z-index: -10;
    height: 0;
    width: 0;
    pointer-events: none;
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    body { padding: 10px; }
    h2 { font-size: 16px; }
    .group { padding: 12px; }
    .row, .row.row-3 { grid-template-columns: 1fr; }
    input, select, textarea, button { font-size: 14px; }
    .preview-container { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <h2>📝 Criar Post</h2>

    <div class="group">
      <span class="label-tit">⛩️ Identificação</span>
      <input type="text" id="nome" placeholder="Nome Principal" oninput="update()">
      <div class="row" style="margin-top:8px">
        <input type="text" id="nome_alt" placeholder="Nome Alternativo" oninput="update()">
        <input type="text" id="abrev" placeholder="Abreviação (Ex: Naruto)" oninput="update()">
      </div>
    </div>

    <div class="group">
      <span class="label-tit">🎭 Tags (Automático: Ordena A-Z)</span>
      <input type="text" id="tags" placeholder="Ex: Isekai, Ação, Comédia" oninput="update()">
      <div class="help-text">Resultado: #ação, #comédia, #isekai</div>
    </div>

    <div class="group">
      <span class="label-tit">📊 Dados Técnicos</span>
      <div class="row">
        <input list="audio_list" id="audio" placeholder="Áudio" oninput="update()">
        <datalist id="audio_list">
          <option value="#legendado"></option>
          <option value="#dublado"></option>
          <option value="#dublado & #legendado"></option>
        </datalist>
        <input list="origem_list" id="origem" placeholder="Origem" oninput="update()">
        <datalist id="origem_list">
          <option value="Mangá"></option>
          <option value="Light Novel"></option>
          <option value="Original"></option>
        </datalist>
      </div>
      <div class="row">
        <input type="text" id="ano_ini" placeholder="Ano Início" oninput="update()">
        <input type="text" id="ano_fim" placeholder="Ano Fim" oninput="update()">
      </div>
      <div class="row">
        <input type="text" id="estudio" placeholder="Estúdio" oninput="update()">
        <input list="status_list" id="status" placeholder="Status" oninput="update()">
        <datalist id="status_list"><option value="Completo"></option><option value="Lançamento"></option></datalist>
      </div>
      <div class="row row-3">
        <input type="text" id="etaria_nac" placeholder="Idade (14)" oninput="update()">
        <input type="text" id="etaria_int" placeholder="Int. (PG-13)" oninput="update()">
        <input list="tipo_list" id="tipo" placeholder="Tipo (#TV)" oninput="update()">
        <datalist id="tipo_list"><option value="#TV"></option><option value="#Filme"></option></datalist>
      </div>
    </div>

    <div class="group">
      <span class="label-tit">📌 Temporada</span>
      <div class="row">
        <input type="text" id="link" placeholder="Link do Botão/Canal" oninput="update()">
        <input type="text" id="temp_num" placeholder="Texto Link (Ex: 1ª Temporada)" oninput="update()">
      </div>
      <div class="row">
        <input type="text" id="eps" placeholder="Nº Episódios" oninput="update()">
        <input type="text" id="parte" placeholder="Parte (Opcional)" oninput="update()">
      </div>
      <input type="text" id="temp_nome" placeholder="Nome da Temporada (Opcional)" style="margin-top:8px" oninput="update()">
    </div>

    <div class="group">
      <span class="label-tit">ℹ️ Sinopse</span>
      <textarea id="sinopse" oninput="update()" placeholder="Cole a sinopse aqui..."></textarea>
    </div>
  </div>

  <div class="col">
    <h2>👁️ Prévia (Telegram)</h2>
    <div id="preview" class="preview-container"></div>

    <div class="actions">
      <button class="btn-visual" onclick="copiarVisual()">📋 Copiar para Telegram (Formatado)</button>
      <button class="btn-html" onclick="copiarHTML()">&lt;/&gt; Copiar Código HTML (Para Bots)</button>
      <button class="btn-danger" onclick="limpar()">🗑️ Limpar Campos</button>
    </div>

    <textarea id="rawHtml" class="hidden-area"></textarea>
  </div>
</div>

<script>
function update() {
  const d = {
    nome: val('nome', 'Nome do Anime'),
    nome_alt: val('nome_alt'),
    abrev: val('abrev'),
    tags: processarTags(val('tags')),
    audio: val('audio', '#legendado'),
    origem: val('origem', 'Manga'),
    ano_ini: val('ano_ini', '????'),
    ano_fim: val('ano_fim', 'Pres'),
    estudio: val('estudio', 'Desconhecido'),
    etaria_nac: val('etaria_nac', '?'),
    etaria_int: val('etaria_int', '?'),
    tipo: val('tipo', '#TV'),
    status: val('status', 'Completo'),
    link: val('link', '#'),
    temp_num: val('temp_num', '1ª Temporada'),
    eps: val('eps', '?'),
    parte: val('parte'),
    temp_nome: val('temp_nome'),
    sinopse: val('sinopse', 'Sem descrição.')
  };

  const l_nome_alt = d.nome_alt ? ` (${d.nome_alt})` : '';
  const l_abrev    = d.abrev ? `🏮 | {${d.abrev}}<br>` : '';
  const l_parte    = d.parte ? `🔗 | Parte ${d.parte}<br>` : '';
  const l_temp_nome = d.temp_nome ? `🧩 | ${d.temp_nome}<br>` : '';

  const html =
    `⁣⛩️ | <b>${d.nome}</b>${l_nome_alt}<br>` +
    `${l_abrev}` +
    `👑 | @AnimesUDK<br><br>` +
    `🎭 | Tags | ${d.tags}<br>` +
    `🎧 | Áudio | ${d.audio}<br>` +
    `🗓️ | Ano | ${d.ano_ini} à ${d.ano_fim}<br>` +
    `📖 | Origem | ${d.origem}<br><br>` +
    `🎥 | Estúdio | ${d.estudio}<br>` +
    `🚥 | Etária | ${d.etaria_nac}  (${d.etaria_int})<br>` +
    `📺 | Tipo | ${d.tipo}<br>` +
    `🆙 | Status | ${d.status}<br><br>` +
    `📌 | <a href="${d.link}">${d.temp_num}</a> | ${d.eps} Episódios<br>` +
    `${l_parte}` +
    `${l_temp_nome}` +
    `<br>ℹ️ | Sinopse<br>` +
    `<i><pre>${d.sinopse}</pre></i>`;

  document.getElementById('preview').innerHTML = html;
  document.getElementById('rawHtml').value = html.replace(/<br>/g, '\n');
}

function val(id, def = '') {
  return document.getElementById(id).value || def;
}

function processarTags(str) {
  if (!str) return '#anime';
  let lista = str.split(',')
    .map(t => t.trim().toLowerCase())
    .filter(t => t)
    .map(t => t.startsWith('#') ? t : '#' + t);
  lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));
  return lista.join(', ');
}

async function copiarVisual() {
  const node = document.getElementById('preview');
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  try {
    document.execCommand('copy');
    animarBotao('.btn-visual', '✅ Copiado!');
  } catch (err) {
    if (window.Android && Android.copyText) Android.copyText(node.innerText);
    else alert('Erro ao copiar visual.');
  }
  sel.removeAllRanges();
}

function copiarHTML() {
  const html = document.getElementById('rawHtml').value;
  if (window.Android && Android.copyText) Android.copyText(html);
  else fallbackCopy(html);
  animarBotao('.btn-html', '✅ Copiado!');
}

function fallbackCopy(text) {
  const area = document.createElement('textarea');
  area.value = text;
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  area.remove();
}

function limpar() {
  document.querySelectorAll('input, textarea').forEach(el => el.value = '');
  update();
}

function animarBotao(selector, msg) {
  const btn = document.querySelector(selector);
  if (!btn) return;
  const original = btn.innerHTML;
  btn.innerHTML = msg;
  btn.disabled = true;
  setTimeout(() => {
    btn.innerHTML = original;
    btn.disabled = false;
  }, 1800);
}

update();
</script>
</body>
</html>
