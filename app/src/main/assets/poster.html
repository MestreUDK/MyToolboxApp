<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Posts AniKing (v2.2)</title>
<style>
  :root { --bg: #212121; --panel: #333; --input: #424242; --text: #eee; --accent: #ff9800; --accent-hover: #f57c00; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; }
  
  /* Colunas */
  .col { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; }
  h2 { color: var(--accent); border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0; font-size: 18px; }
  
  /* Formulário */
  .group { background: var(--panel); padding: 15px; border-radius: 8px; border-left: 3px solid var(--accent); }
  .label-tit { font-size: 12px; color: #aaa; font-weight: bold; margin-bottom: 5px; display: block; text-transform: uppercase; }
  
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  input, select, textarea { flex: 1; padding: 10px; background: var(--input); border: 1px solid #555; color: white; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 100px; font-family: inherit; }

  /* Preview e Output */
  .preview-container { background: #17212b; padding: 15px; border-radius: 12px; color: white; font-size: 15px; white-space: pre-wrap; line-height: 1.5; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #000; }
  
  /* Estilos do Telegram simulados */
  .preview-container b { font-weight: 700; color: #fff; }
  .preview-container a { color: #64b5f6; text-decoration: none; font-weight: bold; }
  .preview-container pre { background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; font-family: 'Consolas', monospace; color: #81c784; display: block; margin: 5px 0; white-space: pre-wrap; }
  .preview-container i { font-style: italic; }

  /* Botões */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  
  .btn-visual { background: var(--accent); color: #212121; }
  .btn-visual:hover { background: var(--accent-hover); }
  
  .btn-html { background: #444; color: #ccc; font-size: 13px; padding: 10px; }
  .btn-html:hover { background: #555; }

  .hidden-area { opacity: 0; position: absolute; z-index: -10; height: 0; }
</style>
<script src="android_bridge.js"></script>
<style id="toolbox-mobile-patch">
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: contain; }
  @media (max-width: 720px) {
    body { max-width: 100vw; overflow-x: hidden; }
    button, input, select, textarea { min-height: 44px; }
  }
</style>
<style id="toolbox-poster-mobile">
        @media (max-width: 760px) {
          body { height: auto !important; min-height: 100vh; display: block !important; padding: 12px !important; }
          .col { overflow: visible !important; padding-right: 0 !important; margin-bottom: 18px; }
          .row { flex-direction: column; }
        }
        </style>
</head>
<body>

<div class="col">
  <h2>📝 Criar Post</h2>

  <div class="group">
    <span class="label-tit">⛩️ Identificação</span>
    <input type="text" id="nome" placeholder="Nome Principal" oninput="update()">
    <div class="row" style="margin-top:8px">
      <input type="text" id="nome_alt" placeholder="Nome Alternativo" oninput="update()">
      <input type="text" id="abrev" placeholder="Abreviação (Ex: Naruto)" oninput="update()">
    </div>
  </div>

  <div class="group">
    <span class="label-tit">🎭 Tags (Automático: Ordena A-Z)</span>
    <input type="text" id="tags" placeholder="Ex: Isekai, Ação, Comédia" oninput="update()">
    <div style="font-size:11px; color:#888; margin-top:4px">Resultado: #ação, #comédia, #isekai</div>
  </div>

  <div class="group">
    <span class="label-tit">📊 Dados Técnicos</span>
    <div class="row">
      <input list="audio_list" id="audio" placeholder="Áudio" oninput="update()">
        <datalist id="audio_list">
          <option value="#legendado"></option>
          <option value="#dublado"></option>
          <option value="#dublado & #legendado"></option>
        </datalist>
      <input list="origem_list" id="origem" placeholder="Origem" oninput="update()">
        <datalist id="origem_list">
          <option value="Mangá"></option>
          <option value="Light Novel"></option>
          <option value="Original"></option>
        </datalist>
    </div>
    <div class="row">
      <input type="text" id="ano_ini" placeholder="Ano Início" oninput="update()">
      <input type="text" id="ano_fim" placeholder="Ano Fim" oninput="update()">
    </div>
    <div class="row">
      <input type="text" id="estudio" placeholder="Estúdio" oninput="update()">
      <input list="status_list" id="status" placeholder="Status" oninput="update()">
        <datalist id="status_list"><option value="Completo"></option><option value="Lançamento"></option></datalist>
    </div>
    <div class="row">
      <input type="text" id="etaria_nac" placeholder="Idade (14)" oninput="update()">
      <input type="text" id="etaria_int" placeholder="Int. (PG-13)" oninput="update()">
      <input list="tipo_list" id="tipo" placeholder="Tipo (#TV)" oninput="update()">
        <datalist id="tipo_list"><option value="#TV"></option><option value="#Filme"></option></datalist>
    </div>
  </div>

  <div class="group">
    <span class="label-tit">📌 Temporada</span>
    <div class="row">
      <input type="text" id="link" placeholder="Link do Botão/Canal" oninput="update()">
      <input type="text" id="temp_num" placeholder="Texto Link (Ex: 1ª Temporada)" oninput="update()">
    </div>
    <div class="row">
      <input type="text" id="eps" placeholder="Nº Episódios" oninput="update()">
      <input type="text" id="parte" placeholder="Parte (Opcional)" oninput="update()">
    </div>
    <input type="text" id="temp_nome" placeholder="Nome da Temporada (Opcional)" style="width:100%; margin-top:8px" oninput="update()">
  </div>

  <div class="group">
    <span class="label-tit">ℹ️ Sinopse</span>
    <textarea id="sinopse" oninput="update()" placeholder="Cole a sinopse aqui..."></textarea>
  </div>
</div>

<div class="col">
  <h2>👁️ Prévia (Telegram)</h2>
  
  <div id="preview" class="preview-container"></div>

  <div class="actions">
    <button class="btn-visual" onclick="copiarVisual()">
      📋 Copiar para Telegram (Formatado)
    </button>
    <button class="btn-html" onclick="copiarHTML()">
      &lt;/&gt; Copiar Código HTML (Para Bots)
    </button>
    <button class="btn-html" style="background:#e74c3c; color:white" onclick="limpar()">
      🗑️ Limpar Campos
    </button>
  </div>
  
  <textarea id="rawHtml" class="hidden-area"></textarea>
</div>

<script>
function update() {
  // --- 1. CAPTURA DOS DADOS ---
  const d = {
    nome: val('nome', 'Nome do Anime'),
    nome_alt: val('nome_alt'),
    abrev: val('abrev'),
    tags: processarTags(val('tags')),
    audio: val('audio', '#legendado'),
    origem: val('origem', 'Manga'),
    ano_ini: val('ano_ini', '????'),
    ano_fim: val('ano_fim', 'Pres'),
    estudio: val('estudio', 'Desconhecido'),
    etaria_nac: val('etaria_nac', '?'),
    etaria_int: val('etaria_int', '?'),
    tipo: val('tipo', '#TV'),
    status: val('status', 'Completo'),
    link: val('link', '#'),
    temp_num: val('temp_num', '1ª Temporada'),
    eps: val('eps', '?'),
    parte: val('parte'),
    temp_nome: val('temp_nome'),
    sinopse: val('sinopse', 'Sem descrição.')
  };

  // --- 2. MONTAGEM DAS LINHAS OPCIONAIS ---
  const l_nome_alt = d.nome_alt ? ` (${d.nome_alt})` : '';
  const l_abrev    = d.abrev ? `🏮 | {${d.abrev}}<br>` : ''; 
  const l_parte    = d.parte ? `🔗 | Parte ${d.parte}<br>` : '';
  const l_temp_nome = d.temp_nome ? `🧩 | ${d.temp_nome}<br>` : '';

  // --- 3. MONTAGEM DO HTML ---
  const html = 
    `⁣⛩️ | <b>${d.nome}</b>${l_nome_alt}<br>` +
    `${l_abrev}` +
    `👑 | @AnimesUDK<br><br>` +
    
    `🎭 | Tags | ${d.tags}<br>` +
    `🎧 | Áudio | ${d.audio}<br>` +
    `🗓️ | Ano | ${d.ano_ini} à ${d.ano_fim}<br>` +
    `📖 | Origem | ${d.origem}<br><br>` +
    
    `🎥 | Estúdio | ${d.estudio}<br>` +
    `🚥 | Etária | ${d.etaria_nac}  (${d.etaria_int})<br>` +
    `📺 | Tipo | ${d.tipo}<br>` +
    `🆙 | Status | ${d.status}<br><br>` +
    
    `📌 | <a href="${d.link}">${d.temp_num}</a> | ${d.eps} Episódios<br>` +
    `${l_parte}` +
    `${l_temp_nome}` +
    `<br>ℹ️ | Sinopse<br>` +
    `<i><pre>${d.sinopse}</pre></i>`;

  // Atualiza o preview visual
  document.getElementById('preview').innerHTML = html;
  
  // Atualiza o campo oculto
  document.getElementById('rawHtml').value = html.replace(/<br>/g, '\n');
}

function val(id, def = '') {
  return document.getElementById(id).value || def;
}

// Lógica das Tags: minúsculo, #, separa por vírgula E ORDENA A-Z
function processarTags(str) {
  if (!str) return '#anime';
  
  let lista = str.split(',')
    .map(t => t.trim().toLowerCase()) 
    .filter(t => t) 
    .map(t => t.startsWith('#') ? t : '#' + t);
  
  // Ordenação Alfabética (considerando acentos PT-BR)
  lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));

  return lista.join(', ');
}

// --- FUNÇÕES DE CÓPIA ---

async function copiarVisual() {
  const node = document.getElementById('preview');
  
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  try {
    document.execCommand('copy');
    animarBotao('.btn-visual', '✅ Copiado!');
  } catch (err) {
    alert('Erro ao copiar visual.');
  }
  sel.removeAllRanges();
}

function copiarHTML() {
  const codigo = document.getElementById('rawHtml');
  codigo.select();
  document.execCommand('copy');
  animarBotao('.btn-html', '✅ HTML Copiado!');
}

function animarBotao(selector, msg) {
  const btn = document.querySelector(selector);
  const original = btn.innerText;
  btn.innerText = msg;
  setTimeout(() => btn.innerText = original, 2000);
}

function limpar() {
  document.querySelectorAll('input, textarea').forEach(i => i.value = '');
  update();
}

update();
</script>

</body>
</html>
