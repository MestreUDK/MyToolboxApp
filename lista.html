<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Lista</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11131a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anime Toolbox">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
  :root {
    color-scheme: dark;
    --bg: #11131a;
    --card: #1c1f2a;
    --input: #13151d;
    --text: #f2f3f8;
    --muted: #a1a7b6;
    --border: #343849;
    --primary: #8b7cf6;
    --primary-hover: #6f60df;
    --success: #48b97d;
    --success-hover: #369866;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(103,80,164,.22), transparent 28rem),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
  }

  h2 { color: #d7d2ff; margin-top: 0; }

  .container {
    background: var(--card);
    padding: 20px;
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    max-width: 400px;
    width: 100%;
  }

  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    color: var(--text);
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
  }

  input::placeholder { color: #737a8d; }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139,124,246,.15);
  }

  label { display: block; margin-top: 8px; color: var(--muted); }

  .checkbox {
    display: flex;
    align-items: center;
    margin-top: 8px;
    gap: 6px;
    font-size: 14px;
  }

  .checkbox input { accent-color: var(--primary); }
  .checkbox label { margin: 0; color: var(--text); }

  button {
    width: 100%;
    padding: 10px;
    background: var(--primary);
    border: none;
    color: white;
    font-size: 16px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
  }

  button:hover { background: var(--primary-hover); }

  #copiarBtn { background: var(--success); display: none; }
  #copiarBtn:hover { background: var(--success-hover); }

  pre {
    background: #0d0f15;
    color: #90e7ad;
    border: 1px solid #2d3140;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    white-space: pre-wrap;
    min-height: 50px;
  }
</style>
<style id="toolbox-mobile-patch">
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: contain; }
  @media (max-width: 720px) {
    body { max-width: 100vw; overflow-x: hidden; }
    button, input, select, textarea { min-height: 44px; }
  }
</style>

</head>
<body>

  <div class="container">
    <h2>Gerador de Lista</h2>

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" placeholder="Ex: Bleach">

    <label for="de">De:</label>
    <input type="number" id="de" placeholder="Ex: 1">

    <label for="ate">Até:</label>
    <input type="number" id="ate" placeholder="Ex: 12">

    <div class="checkbox">
      <input type="checkbox" id="zeroEsquerda">
      <label for="zeroEsquerda">Adicionar zero à esquerda (01, 02...)</label>
    </div>

    <button onclick="gerarLista()">Gerar Lista</button>
    <button id="copiarBtn" onclick="copiarLista()">Copiar Lista</button>

    <pre id="resultado"></pre>
  </div>

<script>
function gerarLista() {
  const titulo = document.getElementById('titulo').value.trim();
  const de = parseInt(document.getElementById('de').value);
  const ate = parseInt(document.getElementById('ate').value);
  const usarZero = document.getElementById('zeroEsquerda').checked;

  const resultado = document.getElementById('resultado');
  const copiarBtn = document.getElementById('copiarBtn');

  if (!titulo || isNaN(de) || isNaN(ate) || de > ate) {
    resultado.textContent = "⚠️ Preencha os campos corretamente.";
    copiarBtn.style.display = "none";
    return;
  }

  let lista = "";
  for (let i = de; i <= ate; i++) {
    const numero = usarZero ? String(i).padStart(2, '0') : i;
    lista += `${titulo} | ${numero}: \n`;
  }

  resultado.textContent = lista.trim();
  copiarBtn.style.display = "block";
}

function copiarLista() {
  const texto = document.getElementById('resultado').textContent;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto)
      .then(mostrarMensagemCopiado)
      .catch(() => fallbackCopiar(document.getElementById('resultado')));
  } else {
    fallbackCopiar(document.getElementById('resultado'));
  }
}

function fallbackCopiar(elemento) {
  const range = document.createRange();
  range.selectNodeContents(elemento);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  try {
    document.execCommand('copy');
    mostrarMensagemCopiado();
  } catch {
    alert("Não foi possível copiar automaticamente.\nSelecione e copie manualmente.");
  }
  sel.removeAllRanges();
}

function mostrarMensagemCopiado() {
  const btn = document.getElementById('copiarBtn');
  const textoOriginal = btn.textContent;
  btn.textContent = "✅ Copiado!";
  btn.disabled = true;

  setTimeout(() => {
    btn.textContent = textoOriginal;
    btn.disabled = false;
  }, 2000);
}
</script>

<script src="pwa.js"></script>
</body>
</html>
